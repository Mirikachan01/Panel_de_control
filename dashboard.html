<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b1220;
    color:#e2e8f0;
}
.container{
    max-width:1300px;
    margin:auto;
    padding:30px;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}
.btn{
    background:#2563eb;
    padding:10px 20px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:bold;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}
.card{
    background:#111827;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
.card h3{
    margin:0;
    font-size:14px;
    color:#9ca3af;
}
.card p{
    font-size:24px;
    margin-top:10px;
    font-weight:bold;
}
.section{
    margin-top:40px;
}
canvas{
    background:#111827;
    padding:20px;
    border-radius:16px;
}
</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>📊 Business Control Panel</h1>
<a class="btn" href="https://docs.google.com/spreadsheets/d/15NqNQUDzMcxNxuo4WPQoxyrAuUHlWwnR4AHwBtZY59U/edit?usp=sharing" target="_blank">Abrir Google Sheets</a>
</div>

<div class="cards">
<div class="card">
<h3>Ganancia Total</h3>
<p id="total">Bs 0</p>
</div>

<div class="card">
<h3>Producto Más Vendido</h3>
<p id="topProducto">-</p>
</div>
</div>

<div class="section">
<h2>Ganancias vs Pérdidas</h2>
<canvas id="grafico"></canvas>
</div>

<div class="section">
<h2>Panel Proveedor</h2>
<div class="cards">
<div class="card">
<h3>Último Pedido</h3>
<p id="ultimoPedido">-</p>
</div>
<div class="card">
<h3>Costo Total</h3>
<p id="costoTotal">-</p>
</div>
<div class="card">
<h3>Productos</h3>
<p id="productosProveedor">-</p>
</div>
</div>
</div>

</div>

<script>

const VENTAS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoREiwgeBQMPFIisMcqldbqbS1dOPJVFkmpP2zguLJBCrJDGweTjsui7KOmd8dkTzGMmvsLcah6mR/pub?gid=0&single=true&output=csv";
const PROVEEDOR_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKoREiwgeBQMPFIisMcqldbqbS1dOPJVFkmpP2zguLJBCrJDGweTjsui7KOmd8dkTzGMmvsLcah6mR/pub?gid=1784526279&single=true&output=csv";

async function cargarVentas(){

    const res = await fetch(VENTAS_URL);
    const text = await res.text();
    const rows = text.split("\n").slice(1);

    let total = 0;
    let ganancias = 0;
    let perdidas = 0;
    let conteoProductos = {};

    rows.forEach(row=>{
        let cols = row.split(",");
        if(cols.length < 5) return;

        let producto = cols[1];
        let ganancia = parseFloat(cols[4]);

        total += ganancia;

        if(ganancia >= 0){
            ganancias += ganancia;
        } else {
            perdidas += Math.abs(ganancia);
        }

        conteoProductos[producto] = (conteoProductos[producto] || 0) + 1;
    });

    document.getElementById("total").innerText = "Bs " + total;

    let top = Object.keys(conteoProductos).reduce((a,b)=> 
        conteoProductos[a] > conteoProductos[b] ? a : b
    );

    document.getElementById("topProducto").innerText = top;

    new Chart(document.getElementById("grafico"),{
        type:"doughnut",
        data:{
            labels:["Ganancias","Pérdidas"],
            datasets:[{
                data:[ganancias,perdidas],
                backgroundColor:["#22c55e","#ef4444"]
            }]
        }
    });
}

async function cargarProveedor(){

    const res = await fetch(PROVEEDOR_URL);
    const text = await res.text();
    const rows = text.split("\n").slice(1);

    if(rows.length > 0){
        let cols = rows[0].split(",");

        document.getElementById("ultimoPedido").innerText = cols[0];
        document.getElementById("costoTotal").innerText = "Bs " + cols[1];
        document.getElementById("productosProveedor").innerText = cols[2];
    }
}

cargarVentas();
cargarProveedor();

async function cargarVentas(){

    const res = await fetch(VENTAS_URL);
    const text = await res.text();

    const rows = text.trim().split("\n").slice(1);

    let total = 0;
    let ganancias = 0;
    let perdidas = 0;
    let conteoProductos = {};

    rows.forEach(row=>{
        if(!row) return;

        // Limpia comillas y espacios
        let cols = row.split(",").map(c => c.replace(/"/g,'').trim());

        if(cols.length < 5) return;

        let producto = cols[1];
        let ganancia = parseFloat(cols[4]) || 0;

        total += ganancia;

        if(ganancia >= 0){
            ganancias += ganancia;
        } else {
            perdidas += Math.abs(ganancia);
        }

        if(producto){
            conteoProductos[producto] = (conteoProductos[producto] || 0) + 1;
        }
    });

    document.getElementById("total").innerText = "Bs " + total;

    let topProducto = "-";

    if(Object.keys(conteoProductos).length > 0){
        topProducto = Object.keys(conteoProductos).reduce((a,b)=>
            conteoProductos[a] > conteoProductos[b] ? a : b
        );
    }

    document.getElementById("topProducto").innerText = topProducto;

    new Chart(document.getElementById("grafico"),{
        type:"doughnut",
        data:{
            labels:["Ganancias","Pérdidas"],
            datasets:[{
                data:[ganancias,perdidas],
                backgroundColor:["#22c55e","#ef4444"]
            }]
        }
    });
}

</script>

</body>
</html>
